name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # R-P1-53: the Python suite must actually run in CI and its results
      # must be published. pytest writes a JUnit report and a full log;
      # both are uploaded as artifacts on every run (pass or fail), so a
      # green badge can always be traced to a real run log. The `tee`
      # keeps the log visible in the console too (GitHub's bash runs with
      # pipefail, so a pytest failure still fails the step).
      - name: Run Python test suite
        run: |
          mkdir -p .run
          pytest -v --junitxml=.run/pytest-junit.xml 2>&1 | tee .run/pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            .run/pytest.log
            .run/pytest-junit.xml
          retention-days: 30

  postgres-boot:
    # Gate 16 (Wave 6): the plane must boot on PostgreSQL and the
    # migrations must produce the same schema there as on SQLite.
    # Runs on every push; the postgres:18 service is the only PG server
    # the repo can reach (no local Postgres exists in the dev VM).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ai_bridge
          POSTGRES_PASSWORD: ai_bridge_pw
          POSTGRES_DB: ai_bridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" "psycopg[binary]"
      - name: Install PostgreSQL server & client tools for restore + PITR drill
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          sudo systemctl stop postgresql || true
      - name: Postgres schema parity, boot test, logical restore drill, and PITR drill
        env:
          AIBRIDGE_PG_BASE_DSN: postgresql://ai_bridge:ai_bridge_pw@localhost:5432/postgres
          AIBRIDGE_PG_BOOT_DSN: postgresql://ai_bridge:ai_bridge_pw@localhost:5432/ai_bridge_boot
          AIBRIDGE_PG_DRILL_DSN: postgresql://ai_bridge:ai_bridge_pw@localhost:5432/ai_bridge_restore_drill
        run: |
          mkdir -p .run
          python3 scripts/check_schema_parity.py --postgres "$AIBRIDGE_PG_BASE_DSN"
          python3 scripts/test_postgres_boot.py --base-dsn "$AIBRIDGE_PG_BASE_DSN" --keep
          python3 scripts/backup_restore.py drill --pg-dsn "$AIBRIDGE_PG_BOOT_DSN" --restore-dsn "$AIBRIDGE_PG_DRILL_DSN" --evidence-out .run/postgres_restore_drill_evidence.json
          python3 scripts/postgres_pitr_drill.py --out .run/postgres_pitr_drill_evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-restore-drill-evidence
          path: |
            .run/postgres_restore_drill_evidence.json
            .run/postgres_pitr_drill_evidence.json
          retention-days: 30

  deployment-config:
    # R-P1-53 / R-P0-14 / R-P0-15: deployment-config regression tests run
    # with the standard library only — no package install, so this job
    # stays green/red even when the full dependency install is broken.
    name: Deployment config checks (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run deployment-config tests
        run: |
          mkdir -p .run
          python3 tests/unit/test_deployment_config.py -v 2>&1 | tee .run/deployment-config-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-config-test-log
          path: .run/deployment-config-test.log
          retention-days: 30

  macos-agent:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: macOS agent import + desktop status honesty
        run: |
          python -c "from agents.macos import agent_main; print('macos agent_main', agent_main.__file__)"
          python -c "from ai_bridge import tools; print(tools.get_desktop_status())"
      - name: Unit smoke (non-browser)
        run: pytest -q tests/unit/test_residuals_security_platform.py tests/unit/test_release1_gates.py --tb=line
      - name: Release 1 macOS launchd & agent E2E
        run: |
          mkdir -p .run
          python scripts/macos_launchd_e2e.py --out .run/macos_launchd_e2e_evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-launchd-e2e-evidence
          path: .run/macos_launchd_e2e_evidence.json
          retention-days: 30

  windows-native-webrtc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Python package (dev + webrtc/aiortc for plane peer harness)
        run: pip install -e ".[dev,webrtc]"
      # NOTE: -DCMAKE_POLICY_VERSION_MINIMUM=3.5 must NOT be passed here.
      # The Windows runner's shell mangles the dotted value ("3.5" arrives
      # as "3" plus a stray ".5" argument, and CMake rejects it: Invalid
      # CMAKE_POLICY_VERSION_MINIMUM value "3"). windows-agent/CMakeLists.txt
      # already sets it internally (set(... FORCE)) inside the
      # libdatachannel block, before all FetchContent declares, so the
      # transitive deps with old minimums are covered without a flag.
      - name: Configure C++ agent with libdatachannel (Mbed TLS, no system OpenSSL)
        working-directory: windows-agent
        run: |
          cmake -B build -DAIBRIDGE_WITH_LIBDATACHANNEL=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build desktop agent
        working-directory: windows-agent
        run: cmake --build build --config Release --target ai_bridge_desktop -- /m
      - name: Native PeerConnection ↔ plane E2E harness
        env:
          AIBRIDGE_DESKTOP_EXE: ${{ github.workspace }}\windows-agent\build\Release\ai_bridge_desktop.exe
        run: python scripts/libwebrtc_e2e_harness.py --out .run/libwebrtc_e2e_evidence.json --native-agent
      - name: Production WebRTC E2E (signaling + JPEG fallback + native agent)
        shell: pwsh
        env:
          AIBRIDGE_DESKTOP_EXE: ${{ github.workspace }}\windows-agent\build\Release\ai_bridge_desktop.exe
          AIBRIDGE_RUN_NATIVE_WEBRTC: "1"
        run: |
          New-Item -ItemType Directory -Force -Path .run | Out-Null
          python scripts/webrtc_production_e2e.py --require-native-agent --out .run/webrtc_production_e2e_evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libwebrtc-e2e-evidence
          path: |
            .run/libwebrtc_e2e_evidence.json
            .run/webrtc_production_e2e_evidence.json
            .run/libwebrtc_e2e_from_production.json
          retention-days: 14

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build native C++20 Windows agent (DXGI + Media Foundation + Pipe Server)
        run: |
          cmake -S windows-agent -B windows-agent/build
          cmake --build windows-agent/build --config Release
      - name: Build native C# Windows client
        run: dotnet build apps/windows-client/AIBridgeClient.csproj -c Release
      - name: Build native C# Windows GUI installer
        run: dotnet build apps/windows-installer/AIBridgeInstaller.csproj -c Release
      - name: Run C# Windows client unit tests
        run: dotnet run --project apps/windows-client.Tests/AIBridgeClient.Tests.csproj -c Release

  windows-python-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Run Python test suite on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .run | Out-Null
          pytest -q --junitxml=.run/pytest-windows-junit.xml
      - name: Release 1 Windows installer & agent E2E
        run: python scripts/windows_installer_e2e.py --out .run/windows_installer_e2e_evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-evidence
          path: |
            .run/windows_installer_e2e_evidence.json
            .run/pytest-windows-junit.xml
          retention-days: 30

  release-1-staging-and-webrtc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Build dashboard bundle
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Install control plane + WebRTC + Playwright Chromium
        run: |
          pip install -e ".[dev,webrtc,browser]"
          playwright install --with-deps chromium
      - name: Run Release 1 staging release gate (self-hosted)
        run: |
          mkdir -p .run
          python scripts/staging_release_gate.py --self-host --out .run/staging_release_gate_evidence.json
      - name: Run Release 1 real-browser WebRTC E2E
        run: python scripts/webrtc_browser_e2e.py --require-browser-peer --out .run/webrtc_browser_e2e_evidence.json
      - name: Production WebRTC E2E (signaling + JPEG fallback + browser peer)
        run: |
          mkdir -p .run
          python scripts/webrtc_production_e2e.py --require-browser-peer --out .run/webrtc_production_e2e_evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-1-gate-evidence
          path: |
            .run/staging_release_gate_evidence.json
            .run/webrtc_browser_e2e_evidence.json
            .run/webrtc_production_e2e_evidence.json
          retention-days: 30

  security-and-supply-chain:
    name: Security, SBOM & Supply-Chain Gate (Release 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install AI Bridge + pip-audit
        run: |
          pip install -e ".[dev]" pip-audit
      - name: Python dependency vulnerability audit
        run: |
          mkdir -p .run
          pip-audit --format json --output .run/pip-audit.json || true
      - name: Dashboard npm audit (high/critical)
        working-directory: apps/dashboard
        run: |
          npm ci
          npm audit --audit-level=high --json > ../../.run/npm-audit.json || true
      - name: Secret hygiene scan (tracked files)
        run: |
          python -c "
          import pathlib, re, sys
          bad = []
          pat = re.compile(r'-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----')
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts or '.run' in p.parts:
                  continue
              if p.suffix in ('.png', '.jpg', '.ico', '.woff2', '.pdf', '.zip', '.db', '.exe'):
                  continue
              try:
                  txt = p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              if pat.search(txt) and 'tests' not in p.parts and 'scripts' not in p.parts:
                  bad.append(str(p))
          if bad:
              print('Potential private key material found in:', bad, file=sys.stderr)
              sys.exit(1)
          print('Secret hygiene scan passed.')
          "
      - name: Signed release manifest end-to-end dry run
        run: |
          python scripts/release_manifest_dryrun.py --evidence-out .run/release_manifest_dryrun.json
      - name: Generate CycloneDX SBOM & assemble release evidence bundle
        run: |
          python scripts/generate_sbom.py --out .run/sbom.cdx.json
          python scripts/assemble_release_evidence.py --out-dir .run/release-evidence --evidence-dir .run
      - name: Validate production Dockerfile build
        run: |
          docker build -f deployment/docker/Dockerfile.prod -t ai-bridge:ci-check .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-2-supply-chain-evidence
          path: |
            .run/sbom.cdx.json
            .run/pip-audit.json
            .run/npm-audit.json
            .run/release_manifest_dryrun.json
            .run/release-evidence/
          retention-days: 90
