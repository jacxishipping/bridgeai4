name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label (e.g. 0.3.0)"
        required: false
        default: ""
      bundle_agent_desktop:
        description: "Build & bundle optional cross-platform agent-desktop CLI + FFI binaries"
        type: boolean
        required: false
        default: false
      bundle_screen_relay:
        description: "Build & bundle optional cross-platform vercel-labs/screen-relay relay-engine binaries"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-sign-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install package, build tools, and vulnerability scanner
        run: |
          pip install -e ".[dev]" build pip-audit

      - name: Verify lint, schema parity, docs, policy fixtures & unit tests
        run: |
          mkdir -p .run
          ruff check .
          python scripts/check_schema_parity.py
          python scripts/generate_api_reference.py --check
          python scripts/generate_env_reference.py --check
          python scripts/verify_policy_fixtures.py
          pytest -q --junitxml=.run/release-pytest.xml

      - name: Dependency vulnerability scans (Python + npm)
        run: |
          pip-audit --format json --output .run/pip-audit.json || true
          npm --prefix apps/dashboard ci
          npm --prefix apps/dashboard audit --audit-level=high --json > .run/npm-audit.json || true
          npm --prefix apps/dashboard run typecheck
          npm --prefix apps/dashboard run build

      - name: Build Python sdist and wheel
        run: |
          python -m build --outdir .run/dist

      - name: Generate signed release manifest (dry-run verified)
        run: |
          python scripts/release_manifest_dryrun.py --evidence-out .run/release_manifest_dryrun.json
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; fi
          if [ -z "$VERSION" ]; then VERSION="0.3.0"; fi
          python scripts/generate_release_manifest.py \
            --repo . \
            --version "$VERSION" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}" \
            --out .run/release-manifest.json
          if [ -n "${{ secrets.AI_BRIDGE_RELEASE_SIGNING_KEY }}" ]; then
            printf '%s' "${{ secrets.AI_BRIDGE_RELEASE_SIGNING_KEY }}" > /tmp/release-ed25519.pem
            chmod 600 /tmp/release-ed25519.pem
            python -m ai_bridge.updates sign \
              --private-key /tmp/release-ed25519.pem \
              --manifest .run/release-manifest.json > .run/release-manifest.json.sig
            rm -f /tmp/release-ed25519.pem
          fi

      - name: Assemble CycloneDX SBOM & checksummed release evidence bundle
        run: |
          python scripts/assemble_release_evidence.py \
            --out-dir .run/release-evidence \
            --evidence-dir .run

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.ref_name }}
          path: |
            .run/dist/
            .run/release-manifest.json
            .run/release-manifest.json.sig
            .run/release-evidence/
          retention-days: 90

  build-windows-installer:
    name: Build Windows C# WPF GUI Setup (AIBridgeSetup.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Run C# Windows client unit tests
        run: dotnet run --project apps/windows-client.Tests/AIBridgeClient.Tests.csproj -c Release
      - name: Build single-file AIBridgeSetup.exe installer
        shell: pwsh
        run: pwsh scripts/build_windows_installer.ps1 -OutDir .run/windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: |
            .run/windows-release/AIBridgeSetup.exe
            .run/windows-release/AIBridgeSetup.exe.sha256
          retention-days: 90

  build-linux-terminal-app:
    name: Build Linux Interactive Terminal Studio (ai-bridge-linux-tui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package executable Linux Terminal Studio bundle (zipapp + launcher)
        run: |
          mkdir -p .run/linux-release/pkg
          cp -r src/ai_bridge .run/linux-release/pkg/
          cp -r agents/common .run/linux-release/pkg/
          cp -r agents/linux .run/linux-release/pkg/
          cat << 'EOF' > .run/linux-release/pkg/__main__.py
          from linux.agent_main import main
          if __name__ == "__main__":
              main()
          EOF
          python -m zipapp .run/linux-release/pkg \
            --python="/usr/bin/env python3" \
            --output .run/linux-release/ai-bridge-linux-tui \
            --compress
          chmod +x .run/linux-release/ai-bridge-linux-tui
          rm -rf .run/linux-release/pkg
          .run/linux-release/ai-bridge-linux-tui tui --snapshot
          (cd .run/linux-release && sha256sum ai-bridge-linux-tui > ai-bridge-linux-tui.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-terminal-app-${{ github.ref_name }}
          path: |
            .run/linux-release/ai-bridge-linux-tui
            .run/linux-release/ai-bridge-linux-tui.sha256
          retention-days: 90

  build-macos-terminal-app:
    name: Build macOS Interactive Terminal Studio (ai-bridge-macos-tui)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package executable macOS Terminal Studio bundle (zipapp + launcher)
        run: |
          mkdir -p .run/macos-release/pkg
          cp -r src/ai_bridge .run/macos-release/pkg/
          cp -r agents/common .run/macos-release/pkg/
          cp -r agents/macos .run/macos-release/pkg/
          cat << 'EOF' > .run/macos-release/pkg/__main__.py
          from macos.agent_main import main
          if __name__ == "__main__":
              main()
          EOF
          python -m zipapp .run/macos-release/pkg \
            --python="/usr/bin/env python3" \
            --output .run/macos-release/ai-bridge-macos-tui \
            --compress
          chmod +x .run/macos-release/ai-bridge-macos-tui
          rm -rf .run/macos-release/pkg
          .run/macos-release/ai-bridge-macos-tui tui --snapshot
          shasum -a 256 .run/macos-release/ai-bridge-macos-tui > .run/macos-release/ai-bridge-macos-tui.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-terminal-app-${{ github.ref_name }}
          path: |
            .run/macos-release/ai-bridge-macos-tui
            .run/macos-release/ai-bridge-macos-tui.sha256
          retention-days: 90

  bundle-agent-desktop:
    name: Bundle optional agent-desktop (${{ matrix.os }})
    if: inputs.bundle_agent_desktop == true || vars.AI_BRIDGE_BUNDLE_AGENT_DESKTOP == '1'
    # Upstream vercel-labs/agent-desktop builds are best-effort; never block core release publish.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            bin_name: agent-desktop
            lib_name: libagent_desktop_ffi.so
          - os: macos-latest
            target: macos-arm64
            bin_name: agent-desktop
            lib_name: libagent_desktop_ffi.dylib
          - os: windows-latest
            target: windows-x64
            bin_name: agent-desktop.exe
            lib_name: agent_desktop_ffi.dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Checkout vercel-labs/agent-desktop
        uses: actions/checkout@v4
        with:
          repository: vercel-labs/agent-desktop
          path: agent-desktop-src
      - name: Install Linux AT-SPI build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libdbus-1-dev libatspi2.0-dev
      - name: Build agent-desktop CLI & C FFI library
        working-directory: agent-desktop-src
        run: cargo build --release --workspace
      - name: Package & checksum agent-desktop artifacts
        shell: bash
        run: |
          mkdir -p out
          cp "agent-desktop-src/target/release/${{ matrix.bin_name }}" "out/agent-desktop-${{ matrix.target }}$([[ '${{ matrix.os }}' == 'windows-latest' ]] && echo '.exe' || echo '')"
          if [ -f "agent-desktop-src/target/release/${{ matrix.lib_name }}" ]; then
            cp "agent-desktop-src/target/release/${{ matrix.lib_name }}" "out/${{ matrix.target }}-${{ matrix.lib_name }}"
          fi
          (cd out && sha256sum * > "agent-desktop-${{ matrix.target }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: agent-desktop-${{ matrix.target }}-${{ github.ref_name }}
          path: out/
          retention-days: 90

  bundle-screen-relay:
    name: Bundle optional screen-relay engine (${{ matrix.os }})
    if: inputs.bundle_screen_relay == true || vars.AI_BRIDGE_BUNDLE_SCREEN_RELAY == '1'
    # Upstream vercel-labs/screen-relay builds are best-effort; never block core release publish.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            bin_name: relay-engine
          - os: macos-latest
            target: macos-arm64
            bin_name: relay-engine
          - os: windows-latest
            target: windows-x64
            bin_name: relay-engine.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout vercel-labs/screen-relay
        uses: actions/checkout@v4
        with:
          repository: vercel-labs/screen-relay
          path: screen-relay-src
      - name: Install Linux screen-relay C++ build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config libx264-dev libwebsockets-dev libx11-dev libxdamage-dev libxfixes-dev libxtst-dev libxext-dev libwayland-dev
      - name: Build relay-engine binary
        working-directory: screen-relay-src
        shell: bash
        run: |
          cmake -S src/engine -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Package & checksum relay-engine binary
        shell: bash
        run: |
          mkdir -p out
          BIN_PATH=$(find screen-relay-src/build -type f \( -name "relay-engine" -o -name "relay-engine.exe" \) | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            EXT=$([[ "${{ matrix.os }}" == "windows-latest" ]] && echo ".exe" || echo "")
            cp "$BIN_PATH" "out/relay-engine-${{ matrix.target }}${EXT}"
            (cd out && sha256sum * > "relay-engine-${{ matrix.target }}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: screen-relay-${{ matrix.target }}-${{ github.ref_name }}
          path: out/
          retention-days: 90

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-sign-and-bundle, build-windows-installer, build-linux-terminal-app, build-macos-terminal-app, bundle-agent-desktop, bundle-screen-relay]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-sign-and-bundle.result == 'success' && needs.build-windows-installer.result == 'success' && needs.build-linux-terminal-app.result == 'success' && needs.build-macos-terminal-app.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub Release with signed artifacts, SBOM, Windows installer & Linux TUI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upload
          find release-assets -type f \( \
            -name "*.whl" -o -name "*.tar.gz" -o -name "release-manifest.json*" \
            -o -name "sbom.cdx.json" -o -name "SHA256SUMS.txt" -o -name "release-evidence.json" \
            -o -name "AIBridgeSetup.exe" -o -name "AIBridgeSetup.exe.sha256" \
            -o -name "ai-bridge-linux-tui" -o -name "ai-bridge-linux-tui.sha256" \
            -o -name "ai-bridge-macos-tui" -o -name "ai-bridge-macos-tui.sha256" \
            -o -name "agent-desktop-*" -o -name "*agent_desktop_ffi*" \
            -o -name "relay-engine-*" \
          \) -exec cp {} upload/ \;
          gh release create "${GITHUB_REF_NAME}" upload/* \
            --title "AI Bridge ${GITHUB_REF_NAME}" \
            --generate-notes
